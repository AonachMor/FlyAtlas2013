<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html>
<head>
<title>FlyDirect Test Page</title>
<meta http-equiv="content-type" content="text/html; charset=utf-8">
</head>
<body>
<h1>Enter gene identifiers</h1>
<form action="/flydirect/index.html" method="get">
<p><input type="text" name="idtype" size="20"> idtype — e.g. fbgn (also possible: cgnum, symbol or name) </p> 
<p><input type="text" name="gene" size="20"> gene — e.g. FBgn0016038 (or e.g. CG16834, W, hamlet) </p> 
<p><input type="text" name="output" size="20"> txt or xml</p>
<p><input type="submit" name="submit" value="Go"></p>
</form>
</body>
</html>
